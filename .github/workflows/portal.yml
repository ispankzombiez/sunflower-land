# Example Portal Deploy
name: Portal deploy

on:
  push:
    branches:
      - portal

jobs:
  deploy:
    concurrency: portal-deploy
    environment: develop
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%dT%H:%M')"

      - name: Get the current version ref
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_SHA}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: false

          VITE_PORTAL_APP: "nightshade-arcade"
          VITE_CLIENT_VERSION: ${{ steps.date.outputs.date }}
          VITE_RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
          VITE_PRIVATE_IMAGE_URL: "https://sunflower-land.com/game-assets"
          VITE_API_URL: "https://api-dev.sunflower-land.com"
          VITE_PORTAL_GAME_URL: "https://nightshade-arcade.minigames.sunflower-land.com"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PORTAL_DEPLOY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PORTAL_DEPLOY_SECRET }}
          aws-region: ap-southeast-2

      - name: Deploy static site to S3 subdomain
        run: |
          aws s3 sync ./dist/ s3://sfl-minigames/nightshade-arcade.minigames.sunflower-land.com --delete --exclude "index.html" --exclude "sw.js" --exclude "manifest.webmanifest"
          aws s3 cp ./dist/index.html s3://sfl-minigames/nightshade-arcade.minigames.sunflower-land.com/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws s3 cp ./dist/sw.js s3://sfl-minigames/nightshade-arcade.minigames.sunflower-land.com/sw.js --cache-control "no-cache, no-store, must-revalidate" --content-type "application/javascript"
          aws s3 cp ./dist/manifest.webmanifest s3://sfl-minigames/nightshade-arcade.minigames.sunflower-land.com/manifest.webmanifest --cache-control "no-cache, no-store, must-revalidate" --content-type "application/manifest+json"

      - name: Invalidate CloudFront (if distribution is configured)
        if: ${{ secrets.PORTAL_CF_DISTRIBUTION != '' }}
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.PORTAL_CF_DISTRIBUTION }}
          PATHS: "/*"
          AWS_REGION: "ap-southeast-2"
          AWS_ACCESS_KEY_ID: ${{ secrets.PORTAL_DEPLOY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PORTAL_DEPLOY_SECRET }}
